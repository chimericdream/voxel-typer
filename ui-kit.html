<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Developer page (M2-07): served by `npm run dev` and the e2e build, never in dist/. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'"
    />
    <title>UI kit preview · Voxel Typer</title>
    <style>
      body {
        margin: 0;
        background: #1b1d22;
      }
      main {
        display: flex;
        flex-direction: column;
      }
      .theme {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px 24px 32px;
      }
      .theme-title {
        margin: 0;
        font-family: var(--font-pixel);
        font-size: calc(var(--fs-lg) * var(--text-scale));
      }
      /* A stand-in for the 3D scene: sky over blocky ground, to show text plates over busy color. */
      .scene {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
        background:
          repeating-linear-gradient(90deg, #3f7a2a 0 24px, #55962f 24px 48px) bottom / 100% 24px
            no-repeat,
          repeating-linear-gradient(90deg, #7c5336 0 24px, #63402a 24px 48px) bottom / 100% 48px
            no-repeat,
          linear-gradient(#87c5ee, #f2e3b6);
        image-rendering: pixelated;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 16px;
        align-items: start;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      p {
        margin: 0;
      }
      .big {
        font-family: var(--font-pixel);
        font-size: calc(var(--fs-lg) * var(--text-scale));
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="ui-kit"></div>
    <script type="module" src="/src/dev/ui-kit.tsx"></script>
  </body>
</html>
