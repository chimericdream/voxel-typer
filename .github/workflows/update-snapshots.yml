# The only way screenshot baselines are made (docs/impl/README.md §3.7): Playwright runs with
# --update-snapshots in the same Linux container as CI and commits changed PNGs to the branch.
#
# Start it with `gh workflow run update-snapshots.yml -f branch=task/M0-04`, or comment
# `/update-snapshots` on the PR (repo owner only). A comment doesn't do the work itself: the
# `request` job checks it and dispatches this workflow with the PR's branch, so every real run
# is a dispatch keyed by branch (see `concurrency`).
#
# Token exposure (docs/ci.md, "Updating screenshot baselines"): `update` runs the branch's code
# (npm ci, build, Playwright) with a read-only token and no stored git credentials. Only `push`,
# which runs no branch code, holds `contents: write`.
#
# Commits pushed with GITHUB_TOKEN don't start workflows, so after pushing, the `finish` job
# dispatches ci.yml on the branch. That run reports every check (including ci-ok) on the new head.
name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update (the PR's head branch)
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

# Dispatches for the same branch queue behind each other (a newer pending request replaces an
# older pending one; both would do the same thing). Every comment run, matching or not, gets a
# group of its own, so an unrelated comment can never replace a queued snapshot run.
concurrency:
  group: >-
    update-snapshots-${{ github.event_name == 'workflow_dispatch'
    && format('branch-{0}', inputs.branch) || format('comment-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    # Jobs that run inside a container default to `sh`; every script here assumes bash
    # (`set -o pipefail`, `[[ ]]`). Found on the first real /update-snapshots run (PR #94).
    shell: bash

jobs:
  request:
    name: request from comment
    # PR comments only, starting with /update-snapshots, by the repo owner.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/update-snapshots') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatches this workflow
      pull-requests: write # reacts to the comment
    steps:
      - name: Dispatch on the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null || true
          head_repo="$(gh api "repos/$REPO/pulls/$ISSUE" --jq .head.repo.full_name)"
          if [ "$head_repo" != "$REPO" ]; then echo "::error::PR #$ISSUE comes from a fork ($head_repo). Not updating it."; exit 1; fi
          branch="$(gh api "repos/$REPO/pulls/$ISSUE" --jq .head.ref)"
          gh workflow run update-snapshots.yml --repo "$REPO" -f branch="$branch"
          echo "Dispatched Update snapshots on \`$branch\` (PR #$ISSUE)." >> "$GITHUB_STEP_SUMMARY"

  resolve:
    name: resolve branch
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # finds the PR for the branch
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      sha: ${{ steps.branch.outputs.sha }}
      pr: ${{ steps.branch.outputs.pr }}
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - name: Resolve branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = main ]; then echo "::error::Baselines reach main through a PR. Run this on the PR branch."; exit 1; fi
          sha="$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)" || { echo "::error::No branch '$BRANCH'"; exit 1; }
          pr="$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq '.[0].number // empty')"
          {
            echo "branch=$BRANCH"
            echo "sha=$sha"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.sha }}
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - name: Playwright version (picks the container image)
        id: pw
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  # Runs the branch's code: read-only token, no git credentials on disk, no npm cache (an
  # issue_comment or dispatch run saves caches in main's scope, which every CI run restores).
  update:
    name: update snapshots
    needs: resolve
    runs-on: ubuntu-latest
    # The full suite outgrew 30 minutes (run 43441195360 was cancelled at the limit, M3-FIX-13).
    timeout-minutes: 50
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.resolve.outputs.playwright }}-noble
      options: --ipc=host --init
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      tests: ${{ steps.test.outputs.status }}
    env:
      CI: "1"
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build:test
      - name: Playwright with --update-snapshots
        id: test
        run: |
          set +e
          npx playwright test --update-snapshots=changed --retries=0 --pass-with-no-tests
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Any baseline changed?
        id: diff
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain --untracked-files=all -- tests/e2e/__screenshots__)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No baseline changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload baselines
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baselines
          path: tests/e2e/__screenshots__/
          retention-days: 7
      - name: Upload report
        if: ${{ !cancelled() && steps.test.outputs.status != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Holds the write token, runs no branch code: copies only *.png files from the artifact into
  # tests/e2e/__screenshots__/, commits on top of the exact commit `update` tested and pushes.
  # If the branch moved meanwhile, the push is rejected as non-fast-forward (run it again).
  push:
    name: commit baselines
    needs: [resolve, update]
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the baseline commit
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
      sha: ${{ steps.commit.outputs.sha }}
      files: ${{ steps.commit.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: baselines
          path: ${{ runner.temp }}/baselines
      - name: Commit and push
        id: commit
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SRC: ${{ runner.temp }}/baselines
        run: |
          set -euo pipefail
          dest=tests/e2e/__screenshots__
          if [ -n "$(find "$SRC" -type l)" ]; then echo "::error::The baselines artifact contains symlinks. Refusing."; exit 1; fi
          find "$SRC" -type f ! -name '*.png' -printf '::warning::Ignoring non-PNG file in the artifact: %P\n'
          (cd "$SRC" && find . -type f -name '*.png' -print0) | while IFS= read -r -d '' f; do
            mkdir -p "$dest/$(dirname "$f")"
            cp -- "$SRC/$f" "$dest/$f"
          done
          git add -A -- "$dest"
          if git diff --cached --quiet; then
            echo "No baseline changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --cached --name-only | tr '\n' ' ')"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "test(snapshots): update e2e baselines" -m "Made by the Update snapshots workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "pushed=true"
            echo "sha=$(git rev-parse HEAD)"
            echo "files=$files"
          } >> "$GITHUB_OUTPUT"
          { echo "### Updated baselines"; echo; for f in $files; do echo "- \`$f\`"; done; } >> "$GITHUB_STEP_SUMMARY"

  finish:
    name: rerun CI and report
    needs: [resolve, update, push]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatches ci.yml
      pull-requests: write # comments on the PR
    steps:
      - name: Dispatch CI on the new head
        if: ${{ needs.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
      - name: Comment on the PR
        if: ${{ needs.resolve.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
          UPDATE: ${{ needs.update.result }}
          PUSH: ${{ needs.push.result }}
          PUSHED: ${{ needs.push.outputs.pushed }}
          SHA: ${{ needs.push.outputs.sha }}
          FILES: ${{ needs.push.outputs.files }}
          TESTS: ${{ needs.update.outputs.tests }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "### Update snapshots"
            if [ "$UPDATE" != success ]; then
              echo "The workflow failed before committing anything. See [the run]($RUN)."
            elif [ "$PUSH" = failure ]; then
              echo "Committing the baselines failed (did the branch move during the run?). See [the run]($RUN) and try again."
            elif [ "$PUSHED" = true ]; then
              echo "Committed ${SHA:0:7} with these baselines. Review the PNG diff in **Files changed**."
              echo; for f in $FILES; do echo "- \`$f\`"; done
              echo; echo "CI was dispatched on the new head, because pushes made with GITHUB_TOKEN don't start workflows."
            else
              echo "No baseline changed."
            fi
            if [ "${TESTS:-0}" != 0 ]; then echo; echo "Some tests failed for reasons other than screenshots. See [the run]($RUN)."; fi
          } > comment.md
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
      - name: Fail when tests failed
        if: ${{ needs.update.result != 'success' || needs.update.outputs.tests != '0' || needs.push.result == 'failure' }}
        run: |
          echo "::error::Playwright failed (other than screenshot updates), or the update or commit job failed."
          exit 1
