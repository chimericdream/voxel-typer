  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1d22;

      #scene,
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="scene"></main>
    <script type="module" src="/src/dev/scene-preview.ts"></script>
