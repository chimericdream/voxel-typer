# Voxel Typer on the Proxmox Docker host. Full steps: deploy/README.md. In short, copy this
# directory to the host, then:
#   cp .env.example .env    # add the Tailscale auth key
#   docker compose up -d
# The game is then at https://voxel-typer.<your-tailnet>.ts.net, reachable over the tailnet only.
services:
  # Joins the tailnet as the device `voxel-typer` and terminates HTTPS with `tailscale serve`
  # (serve.json), proxying to the game on 127.0.0.1:8080 in the shared network namespace.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: voxel-typer-tailscale
    hostname: voxel-typer
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: voxel-typer
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking needs no /dev/net/tun, so it works in an unprivileged LXC.
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  voxel-typer:
    image: ghcr.io/chimericdream/voxel-typer:${VOXEL_TYPER_TAG:-stable}
    container_name: voxel-typer
    # Shares the tailscale container's network, so `tailscale serve` reaches 127.0.0.1:8080.
    # Side effect: no port is published, so the game is NOT reachable by the host's LAN IP.
    network_mode: service:tailscale
    depends_on: [tailscale]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: voxel-typer
    restart: unless-stopped

  # Optional: the owner's preview of every merge to main (:edge), on its own tailnet device
  # `voxel-typer-edge`. It needs its own Tailscale sidecar, because both containers listen on
  # 8080. Uncomment both services and the `ts-state-edge` volume below.
  # tailscale-edge:
  #   image: tailscale/tailscale:stable
  #   container_name: voxel-typer-edge-tailscale
  #   hostname: voxel-typer-edge
  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY_EDGE:-${TS_AUTHKEY}}
  #     TS_HOSTNAME: voxel-typer-edge
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_SERVE_CONFIG: /config/serve.json
  #     TS_USERSPACE: "true"
  #   volumes:
  #     - ts-state-edge:/var/lib/tailscale
  #     - ./serve.json:/config/serve.json:ro
  #   restart: unless-stopped
  #
  # voxel-typer-edge:
  #   image: ghcr.io/chimericdream/voxel-typer:edge
  #   container_name: voxel-typer-edge
  #   network_mode: service:tailscale-edge
  #   depends_on: [tailscale-edge]
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #   cap_drop: [ALL]
  #   security_opt:
  #     - no-new-privileges:true
  #   labels:
  #     com.centurylinklabs.watchtower.enable: "true"
  #     com.centurylinklabs.watchtower.scope: voxel-typer
  #   restart: unless-stopped

  # Polls GHCR every 5 minutes and recreates only the containers labelled above (same scope),
  # then deletes the old image. The GHCR package is public, so it needs no registry login.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: voxel-typer-watchtower
    command: --label-enable --scope voxel-typer --interval 300 --cleanup
    labels:
      com.centurylinklabs.watchtower.scope: voxel-typer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  ts-state:
  # ts-state-edge:
