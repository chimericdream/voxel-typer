# nginx config for the Voxel Typer image (copied to /etc/nginx/nginx.conf by the Dockerfile).
#
# Rules this file must keep (tests/unit/deploy/headers.test.ts checks them, and the CI `docker`
# job checks the live responses):
# - Security headers are set ONCE, at server level, with `always`. nginx drops every inherited
#   add_header from a location that has its own add_header, so no location block may use
#   add_header. Per-path values go through a `map` instead (see $vt_cache_control).
# - The CSP header is index.html's CSP <meta> plus `frame-ancestors 'none'` (which a <meta>
#   can't express). Change both together; the unit test compares them.
# - Hashed Vite output under /assets/ is immutable. Everything else (index.html, sw.js,
#   manifest.webmanifest, fonts, icons) is `no-cache`: always revalidated, served from cache
#   on a 304.
#
# Read-only root filesystem: nginx writes only under /tmp (pid file, temp paths), so the
# container runs with `read_only: true` and a tmpfs on /tmp (deploy/docker-compose.yml).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Compress text on the fly. (Brotli needs a third-party module the stock image doesn't ship.)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # $uri is the path actually served, so the SPA fallback (any route -> /index.html) gets no-cache.
  map $uri $vt_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind `tailscale serve` (HTTPS on 443 -> http://127.0.0.1:8080), absolute redirects
    # would point at http://<host>:8080. Relative ones stay on the address the browser used.
    absolute_redirect off;

    # No `always`: an error response (404 for a missing asset) must not be cached for a year.
    add_header Cache-Control $vt_cache_control;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Dotfiles are never part of the build output.
    location ~ /\. {
      return 404;
    }

    # A missing hashed asset is a real 404, not index.html served as JavaScript.
    location /assets/ {
      try_files $uri =404;
    }

    # The stock mime.types has no entry for .webmanifest (it would go out as octet-stream).
    location = /manifest.webmanifest {
      default_type application/manifest+json;
    }

    # SPA fallback: unknown paths get the app shell; the client router takes over.
    location / {
      try_files $uri /index.html;
    }
  }
}
