<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Developer page (M2-14): served by `npm run dev` and the e2e build, never in dist/. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'"
    />
    <title>HUD preview · Voxel Typer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* A stand-in for the 3D scene: sky over blocky ground. ?sky=night uses M2-02's mid-navy. */
      #scene {
        position: fixed;
        inset: 0;
        background:
          repeating-linear-gradient(90deg, #3f7a2a 0 24px, #55962f 24px 48px) 0 62% / 100% 24px
            no-repeat,
          repeating-linear-gradient(90deg, #7c5336 0 24px, #63402a 24px 48px) 0 100% / 100% 38%
            no-repeat,
          linear-gradient(#87c5ee, #f2e3b6);
      }
      #scene[data-sky="night"] {
        background:
          repeating-linear-gradient(90deg, #1f3d1c 0 24px, #2a4d22 24px 48px) 0 62% / 100% 24px
            no-repeat,
          repeating-linear-gradient(90deg, #3a2a20 0 24px, #2e2119 24px 48px) 0 100% / 100% 38%
            no-repeat,
          linear-gradient(#1c2a55, #34467a);
      }
      #hud {
        position: fixed;
        inset: 0;
      }
      .title {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <main id="hud"></main>
    <script type="module" src="/src/dev/hud-preview.tsx"></script>
  </body>
</html>
